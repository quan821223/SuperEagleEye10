syntax = "proto3";

option csharp_namespace = "SC_Grpc.gRPC";

package sc_communication_gRPC ;

service SC_communication_gRPC  {
    rpc SendMessage (MessageRequest) returns (MessageResponse);
    rpc SubscribeMessages (SubscribeRequest) returns (stream MessageResponse);
    rpc SubscribeUpdates (SubscribeRequest) returns (stream MessageResponse);
    rpc SendImage (ImageRequest) returns (stream ImageResponse);
    rpc CommandMessage (MessageRequest) returns (stream MsgResponse);
    rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
    rpc ExecuteCameraCommand (CommandRequest) returns (CommandReply);
    rpc QueryCameraState (QueryRequest) returns (QueryReply);
}

message Empty {}

message ImageResponse {
    bool status = 1;
    string message = 2;
}

message MessagestateResponse {
    bool success = 1;
    string message = 2;
}

message MessageRequest {
    string sender = 1;
    string message = 2;
}

message SubscribeRequest {
    string client_id = 1;
}

message MessageResponse {
    string sender = 1;
    int32 msgType = 2;
    string message = 3;
    int64 timestamp = 4;
}

message ImageRequest {
    bytes image_data = 1;
    string file_name = 2;
    string image_format = 3;
    int32 width = 4;
    int32 height = 5;
    int64 timestamp = 6;
}

message MsgResponse {
    int64 timestamp = 1;
    int32 MsgType = 2;
    string sender = 3;
    bytes bytemessage = 4;
    string strmessage = 5;
}

message HeartbeatRequest {
    string client_id = 1;
    int64 timestamp = 2;
    string version = 3;
    string auth_token = 4;
}

message HeartbeatResponse {
    bool connected = 1;
    bytes ack = 2;
    int64 server_time = 3;
    string message = 4;
}

message CommandRequest {
    string request_id = 1;
    string source = 2;
    string command = 3;
    string camera_id = 4;
    string args_json = 5;
    int64 timestamp = 6;
    bool is_query = 7;
    string auth_token = 8;
}

message CommandReply {
    bool success = 1;
    string request_id = 2;
    bytes ack = 3;
    int32 result_code = 4;
    string message = 5;
    bytes response_frame = 6;
    string payload_json = 7;
    int64 server_time = 8;
}

message QueryRequest {
    string request_id = 1;
    string query = 2;
    string camera_id = 3;
    string args_json = 4;
    int64 timestamp = 5;
    string auth_token = 6;
}

message QueryReply {
    bool success = 1;
    string request_id = 2;
    int32 result_code = 3;
    string message = 4;
    bytes response_frame = 5;
    string payload_json = 6;
    int64 server_time = 7;
}
